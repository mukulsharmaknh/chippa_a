name: Build KernelSU-Next Kernel (OOS 16.0.3.500)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile KernelSU-Next + SUSFS 2.3.0 + NoMount
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            kmod cpio binutils binutils-aarch64-linux-gnu \
            git wget pahole automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl \
            bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev \
            xsltproc unzip dwarves device-tree-compiler python3 ccache \
            git-lfs gnupg imagemagick libelf-dev libncurses5-dev \
            libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync \
            adb fastboot libstdc++6 python-is-python3 \
            gcc-aarch64-linux-gnu
          mkdir -p kernel

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v4
        with:
          repository: mukulsharmaknh/android_kernel_modules_and_devicetree_oneplus_sm8350
          path: temp_modules
          ref: oneplus/sm8350_b_16.0.0_oneplus9rt
          fetch-depth: 1

      - name: Prepare Compiler
        run: |
          set -euo pipefail
          mkdir -p compiler
          cd compiler
          echo "Downloading Clang..."
          curl -fL \
            --connect-timeout 30 \
            --retry 5 \
            --retry-delay 5 \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz" \
            -o clang-r383902b.tar.gz
          echo "Extracting Clang..."
          mkdir -p clang-bin
          tar -xzf clang-r383902b.tar.gz -C clang-bin
          rm -f clang-r383902b.tar.gz

      - name: Handle Dependencies
        run: |
          set -euo pipefail
          echo "Preparing device/vendor and techpack..."
          rm -rf device vendor
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          if [ -d temp_modules/kernel/msm-5.4/techpack ]; then
            echo "Syncing techpack modules from temp_modules..."
            mkdir -p kernel/msm-5.4/techpack
            cp -r temp_modules/kernel/msm-5.4/techpack/* kernel/msm-5.4/techpack/ || true
          fi
          rm -rf temp_modules

      - name: Set Release Info
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Compile Kernel
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          cd kernel/msm-5.4
          clang --version

          echo "=========================================="
          echo "Syncing latest upstream KernelSU-Next (pershoot next-susfs)..."
          echo "=========================================="
          rm -rf KernelSU
          git clone --depth 1 -b next-susfs https://github.com/pershoot/KernelSU-Next.git KernelSU
          git -C KernelSU fetch --unshallow || true

          if [ ! -d NoMount ]; then
            echo "ERROR: NoMount directory missing"
            exit 1
          fi

          echo "=========================================="
          echo "Generating 9RT defconfig..."
          echo "=========================================="
          rm -rf out
          make O=out CC=clang LLVM=1 LLVM_IAS=1 9rt_defconfig

          echo "=========================================="
          echo "Configuring KernelSU-Next + SUSFS 2.3.0 + NoMount..."
          echo "=========================================="
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -d CONFIG_KSU_KPROBES_HOOK \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -d CONFIG_KSU_SUSFS_SUS_SU \
            -e CONFIG_NOMOUNT \
            -e CONFIG_MODVERSIONS \
            -e CONFIG_MODULE_FORCE_LOAD

          make O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=========================================="
          echo "VERIFYING CONFIGURATION"
          echo "=========================================="
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_NOMOUNT=)' out/.config

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "ERROR: CONFIG_KSU is not enabled!"
            exit 1
          fi
          if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "ERROR: CONFIG_KSU_SUSFS is not enabled!"
            exit 1
          fi
          if ! grep -q '^CONFIG_NOMOUNT=y' out/.config; then
            echo "ERROR: CONFIG_NOMOUNT is not enabled!"
            exit 1
          fi

          echo "=========================================="
          echo "COMPILING KERNEL..."
          echo "=========================================="
          make O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" \
            KBUILD_BUILD_USER="Mukul" \
            KBUILD_BUILD_HOST="GitHub-Actions"

      - name: Verify Kernel Build
        run: |
          set -euo pipefail
          IMAGE="kernel/msm-5.4/out/arch/arm64/boot/Image"
          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not generated!"
            exit 1
          fi
          echo "Kernel Image built successfully:"
          ls -lh "$IMAGE"

      - name: Package with AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/Image

          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/msm-5.4/out -type f -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          cd AnyKernel3
          if [ -f ../kernel/msm-5.4/anykernel.sh ]; then
            cp ../kernel/msm-5.4/anykernel.sh ./anykernel.sh
          fi
          chmod 0755 ./anykernel.sh

          zip -r9 "../Mukul-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.zip" . \
            -x ".git/*" -x "README.md" -x "*placeholder"
          cd ..
          ls -lh Mukul-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.zip

      - name: Pack Boot Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p boot_pack
          cd boot_pack

          wget --tries=5 --timeout=30 \
            "https://raw.githubusercontent.com/miaizhe/magiskboot-linux/main/x86_64/magiskboot" \
            -O magiskboot
          chmod +x magiskboot

          echo "Downloading stock boot image for OOS 16.0.3.500..."
          gh release download 16.0.3.500 \
            --repo ${{ github.repository }} \
            --pattern "boot-16.0.3.500.img" \
            --output boot_origin.img \
            --clobber

          if [ ! -s boot_origin.img ]; then
            echo "ERROR: boot-16.0.3.500.img not found in release 16.0.3.500!"
            exit 1
          fi

          ./magiskboot unpack boot_origin.img
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          export PATCHVBMETAFLAG=true
          ./magiskboot repack boot_origin.img "../boot-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.img"
          cd ..
          ls -lh "boot-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.img"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}
          path: |
            boot-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.img
            Mukul-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: KSU-Next-16.0.3.500-${{ env.BUILD_DATE }}
          name: KernelSU-Next + SUSFS 2.3.0 + NoMount for OnePlus 9RT (16.0.3.500)
          body: |
            ## OnePlus 9RT (sm8350) Kernel - OOS 16.0.3.500
            - **Root Solution:** KernelSU-Next
            - **SUSFS:** v2.3.0
            - **NoMount:** Enabled
            - **Hook Mode:** Manual Hook (Syscall Hooks)
            - **Target OOS:** 16.0.3.500
            - **Build Date:** ${{ env.BUILD_DATE }}
          files: |
            boot-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.img
            Mukul-KSU-Next-SUSFS-9RT-16.0.3.500-${{ env.BUILD_DATE }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
